name: ML safety

on:
  pull_request:
    branches:
      - t2-2026-development
  push:
    branches:
      - t2-2026-development

permissions:
  contents: read

env:
  WALKBUDDY_RELEASE_CANDIDATE: WB-OD-NAV-001

jobs:
  ml-safety:
    name: Fast ML safety contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install -r ML_side/requirements-ci.txt

      - name: Run model-free ML safety contracts
        run: >
          python -m pytest -q
          ML_side/tests/test_dataset_manifest_validation.py
          ML_side/tests/test_validate_cvat_yolo_export.py
          ML_side/tests/test_build_navigation_dataset_release.py
          ML_side/tests/test_train_navigation_model.py
          ML_side/tests/test_validate_candidate_model.py
          ML_side/tests/test_compare_model_evaluations.py
          ML_side/tests/test_detection_stabilizer.py
          ML_side/tests/test_navigation_scenario_regression.py
          ML_side/tests/test_evaluation_metrics.py
          ML_side/tests/test_evaluation_pipeline.py
          ML_side/tests/test_evaluation_predictors.py
          ML_side/tests/test_evaluation_report.py
          ML_side/tests/test_evaluation_latency.py
          ML_side/tests/test_ml_pipeline_integration.py
          ML_side/deployment/tests/test_manifest.py
          ML_side/deployment/tests/test_environment_doctor.py
          ML_side/deployment/tests/test_readiness.py
          ML_side/deployment/tests/test_security_and_helper.py
          ML_side/model_registry/tests/test_transitions.py
          ML_side/model_registry/tests/test_validation.py
          software_side/walkbuddy_reactNative/backend/tests/test_navigation_semantics.py
          software_side/walkbuddy_reactNative/backend/tests/test_model_taxonomy_compatibility.py

  candidate-release-readiness:
    name: Candidate release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install -r ML_side/requirements-ci.txt

      - name: Run release-readiness contracts
        run: python -m pytest -q ML_side/tests/test_release_readiness.py

      - name: Run Candidate release-readiness gate
        run: >
          python -m ML_side.tools.release_readiness
          --candidate "$WALKBUDDY_RELEASE_CANDIDATE"
          --out-dir .ci/release-readiness

      - name: Publish Candidate release-readiness summary
        if: always()
        shell: bash
        run: |
          report=.ci/release-readiness/release_readiness.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Candidate release-readiness report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Candidate release-readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-readiness
          path: |
            .ci/release-readiness/release_readiness.json
            .ci/release-readiness/release_readiness.md
          if-no-files-found: warn
          retention-days: 14
